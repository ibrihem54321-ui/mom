<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <title>اعملي ال يتقالك عليه جدع امي </title>
  <meta name="description" content="تجربة تفاعلية بمناسبة عيد ميلاد أمي" />

  <!-- ============================================================
       الخطوط: Cairo لواجهات النظام/التحقق، Lalezar للرسالة الاحتفالية
       ============================================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Lalezar&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============================================================
       طبقة الكونفيتي والجسيمات — كانفاس واحد يغطي الشاشة بالكامل
       ويُستخدم بواسطة script.js في مشهد الاحتفال (المشهد 6)
       ============================================================ -->
  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <!-- ============================================================
       🎵 الموسيقى الخلفية
       ضع رابط ملف الموسيقى هنا في خاصية src (مثال: assets/music.mp3)
       تبدأ تلقائيًا عند دخول المشهد السادس (الاحتفال) وتستمر للنهاية.
       متصفحات الموبايل قد تمنع التشغيل التلقائي بدون تفاعل المستخدم؛
       لهذا تم وضع زر تشغيل احتياطي صغير (fallback) يظهر تلقائيًا
       فقط في حال فشل التشغيل التلقائي — راجع script.js لمزيد من التفاصيل.
       ============================================================ -->
  <audio id="bg-music" loop preload="none">
    <source src="./WhatsApp Audio 2026-08-04 at 5.03.31 AM.mp4" type="audio/mpeg" />
  </audio>

  <!-- زر احتياطي لتشغيل الصوت يدويًا إذا منعه المتصفح تلقائيًا -->
  <button id="music-fallback-btn" class="music-fallback-btn hidden" aria-label="تشغيل الموسيقى" type="button">
    <span class="music-fallback-icon">🎵</span>
  </button>

  <!-- ============================================================
       الحاوية الرئيسية لكل المشاهد — يتم حقن محتوى كل مشهد هنا
       عبر script.js، مع طبقة انتقال (transition overlay) بينها
       ============================================================ -->
  <main id="stage" class="stage" role="main" aria-live="polite"></main>

  <!-- طبقة الفلاش الأبيض المستخدمة في نهاية مشهد التحقق -->
  <div id="flash-overlay" class="flash-overlay" aria-hidden="true"></div>

  <!-- مؤشر تقدم المشاهد (نقاط صغيرة أسفل الشاشة) -->
  <nav class="progress-dots" id="progress-dots" aria-label="تقدم القصة"></nav>

  <!-- ============================================================
       📷 مكان مستقبلي لإضافة صورة (مثال: صورة الأم أو صورة عائلية)
       يمكن إدراجها داخل المشهد السابع أو الثامن عبر إضافة
       <img class="mom-photo" src="assets/mom.jpg" alt="أمي" />
       داخل قالب المشهد المناسب في script.js (دالة renderSceneSeven
       أو renderSceneEight) — تم ترك تنسيق .mom-photo جاهزًا في style.css
       ============================================================ -->
       <button id="close-experience-btn" class="close-btn" type="button"></button>

  <script src="script.js"></script> 
</body>
</html>
